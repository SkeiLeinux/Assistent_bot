<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Дневник питания</title>

<!-- Telegram WebApp SDK — должен грузиться первым, до api.js -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="/static/styles.css" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--tg-bg, #17212B); overflow: hidden; }
  #root { display: flex; }
  #root > .app { flex: 1; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Слой API + Telegram (обычный JS, без JSX) -->
<script src="/static/api.js"></script>

<!-- Компоненты (JSX → Babel компилирует в браузере) -->
<script type="text/babel" data-presets="react" src="/static/icons.jsx"></script>
<script type="text/babel" data-presets="react" src="/static/data.jsx"></script>
<script type="text/babel" data-presets="react" src="/static/components-shared.jsx"></script>
<script type="text/babel" data-presets="react" src="/static/screens.jsx"></script>
<script type="text/babel" data-presets="react" src="/static/goals.jsx"></script>
<script type="text/babel" data-presets="react" src="/static/app.jsx"></script>

<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
