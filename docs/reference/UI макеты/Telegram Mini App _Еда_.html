<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Telegram Mini App «Еда» — прототип</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #1a242f 0%, #0a1117 60%, #060a0e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .caption {
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .caption b { color: rgba(255,255,255,0.65); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 13px; }

  /* Override iOS frame for the app inside */
  .ios-container > div { background: #17212B !important; }
</style>
</head>
<body data-screen-label="Telegram Mini App — Food">

<div class="stage">
  <div id="root"></div>
  <div class="caption">
    <b>Telegram Mini App «Еда»</b><br/>
    интерактивный прототип · тёмная тема · откройте Tweaks для смены сценариев
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="components-shared.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
  function PhoneStage() {
    return (
      <div className="ios-container">
        <IOSDevice dark={true} width={390} height={812}>
          <App />
        </IOSDevice>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<PhoneStage />);
</script>

</body>
</html>
