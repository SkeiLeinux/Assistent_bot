# Набор кейсов смоука выкатки. Инструмент — scripts/smoke.py, ТЗ — docs/05_implementation/
# code-task-smoke-2026-08-10.md §2.
#
# ГЛАВНОЕ ПРАВИЛО ФАЙЛА: эталоны здесь НЕ дублируются. Кейс ссылается на запись
# яруса A по id (`case:`), а числа и путь к снимку смоук берёт из
# tests/eval/manifest.yaml. Ручная копия эталонов в инструмент уже один раз дала
# рассинхрон на 11 кейсах (llm-eval-dataset.md §7a): второй экземпляр правды об
# одном и том же числе разъезжается молча.
#
# Чем этот набор НЕ является: заменой раннеру. У раннера 25 кейсов и порог 2% —
# он про точность модели. Здесь 4 кейса и коридор ±25% — это про то, жив ли
# задеплоенный путь. Метрики раннера (БЖУ, ярус C, стоимость) сюда не переносятся.
#
# Поля:
#   id     — идентификатор кейса смоука
#   case   — id записи яруса A: оттуда берутся файл снимка и эталон
#   kind   — photo | text | cap_reject
#   repeat — только для cap_reject: сколько раз продублировать снимок
#   why    — зачем кейс в наборе; без этого набор через полгода нечем сокращать

cases:
  - id: S-01
    case: A-15
    kind: photo
    why: >-
      тот самый товар, на котором в поле случился F-01 (450 кДж / 110 ккал:
      модель записала в ккал килоджоули и подогнала под них жиры). Главная
      проверка релиза — она же пункт §4 рунбука deploy-2026-08-03.

  - id: S-02
    case: A-16
    kind: photo
    why: >-
      второй kj-first (873.2 кДж / 210.9 ккал) — чтобы прохождение S-01 не
      оказалось совпадением. Один кейс не отличает «C3a работает» от «повезло».

  - id: S-03
    case: A-17
    kind: photo
    why: >-
      контрольная группа, trap=clean. Если мимо и он — дело не в кДж, а в
      транспорте: сломан весь путь, а не разбор этикеток.
      ОГОВОРКА: у A-17 в эталоне fat=null (жир на этикетке не напечатан). Смоук
      сверяет только ккал (§3.3), поэтому это не мешает; но если сюда когда-нибудь
      добавят сверку БЖУ, кейс придётся заменить. Записано, чтобы это не
      выяснилось падением.

  - id: S-04
    kind: text
    text: "200 г гречки"
    why: >-
      текстовая ветка. Числового порога нет намеренно (§3.3): «гречка» без
      уточнения — это 130 ккал/100 г варёной или 330 сухой, эталона не
      существует. Коридор здесь означал бы метрику, чьё «правильно» неизвестно.
      Проверяется структура ответа и границы C4.1.

  - id: S-05
    case: A-17
    kind: cap_reject
    repeat: 11
    why: >-
      негативный контроль. 11 снимков обязаны дать отказ, а не 200 с пятью
      позициями: молчаливая обрезка [:5] жила в роутах до блока 15 и теряла
      ровно тот кадр, ради которого пользователь его прислал. Это не кейс о
      питании — это проверка того, что сам смоук способен увидеть регресс: если
      он «проходит» при выключенном сервисе, он не проверяет ничего.
