# Eval-датасет: сравнение vision-моделей на распознавании КБЖУ.
# Спецификация: docs/05_implementation/llm-eval-dataset.md (SSOT по схеме, метрикам, порогам).
#
# tier: A (этикетки, эталон = цифры с упаковки) | B (тарелки, эталона нет) | C (составное блюдо, эталон = сумма по A)
#
# Схема кейса яруса A:
#
# - id: A-01
#   tier: A
#   image: images/A-01_kj-only.jpg
#   trap: kj-only              # тег ловушки — для группировки в отчёте по §4
#   ground_truth:
#     basis: per100g            # per100g | per_portion
#     kcal: 119
#     protein: 7.8
#     fat: 4.2
#     carbs: 11.5
#     name: творог
#     brand: Простоквашино
#   note: на упаковке только кДж (496), ккал не напечатаны
#   confidence: high            # high | low — low, если эталон прочитан с самого тестового (нечитаемого) фото и не подтверждён отдельно
#
# Теги trap (§3): kj-only · small-font-ru · glare-crumpled · per-portion · dual-table · composite-product · clean

