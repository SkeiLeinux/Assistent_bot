[tool.importlinter]
root_package = "app"

# Контракт слоёв target-архитектуры (ADR-0004, roadmap §3).
# Слои сверху вниз: верхний может импортировать нижние, не наоборот.
# Транзитные пакеты S0 (app.services, app.repositories, app.handlers) — ВНЕ контракта
# по построению: они нарушают границы target и приводятся к specs в своих срезах
# (kernel S1, write-side S2, read/delivery S3). config — leaf-утилита, не слой.
[[tool.importlinter.contracts]]
name = "Layered architecture (S0)"
type = "layers"
layers = [
    "app.main",
    "app.delivery",
    "app.analytics",
    "app.contexts",
    "app.notifications",
    "app.scheduler",
    "app.kernel",
    "app.db",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
